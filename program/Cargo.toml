[package]
name = "sns-records"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Bindings and program code for the Solana Name Service Records protocol"
repository = "https://github.com/SolanaNameService/sns-records"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
no-entrypoint = []
test-bpf = []
devnet = ["sns-warp-common/devnet"]

[dependencies]
solana-program = "4.0.0"
borsh = { version = "1.7.0", features = ["derive"] }
thiserror = "1.0.24"
num-traits = "0.2"
num-derive = "0.3"
bonfida-utils = "0.9.2"
spl-name-service = { version = "0.5.0", package = "spl-name-service-2", features = [
    "no-entrypoint",
] }
bytemuck = "1.13.1"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
hex = "0.4.3"
solana-security-txt = "1.1.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
sns-warp-common = { version = "0.3.0", features = [
    "solana",
] }

[dev-dependencies]
solana-sdk = "4.0.1"
solana-program-test = { version = "4.2.2", features = ["agave-unstable-api"] }
tokio = { version = "1.6", features = ["macros"] }

[lib]
crate-type = ["cdylib", "lib"]
